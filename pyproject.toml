[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ridership"
version = "0.1.0"
description = "Daily NYC transit ridership forecasting: honest backtests, Prophet vs XGBoost vs baselines, MLflow tracking, drift monitoring"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "pyyaml", "holidays", "scikit-learn", "xgboost", "prophet", "mlflow", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
